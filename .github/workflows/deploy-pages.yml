name: Deploy web demo to GitHub Pages

on:
  push:
    branches: [claude/project-cy6r4n, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
      - run: flutter pub get
      - run: flutter test
      # Supabase keys come from the repository variables (Settings > Secrets
      # and variables > Actions > Variables). Empty = demo data.
      - run: >-
          flutter build web --release --pwa-strategy=none
          --base-href "/${{ github.event.repository.name }}/"
          --dart-define=SUPABASE_URL=${{ vars.SUPABASE_URL }}
          --dart-define=SUPABASE_ANON_KEY=${{ vars.SUPABASE_ANON_KEY }}
      # The follow-up & management dashboard: a separate app for the
      # association's staff, published under /admin/.
      - run: >-
          flutter build web --release --pwa-strategy=none
          -t lib/main_admin.dart -o build/web_admin
          --base-href "/${{ github.event.repository.name }}/admin/"
          --dart-define=SUPABASE_URL=${{ vars.SUPABASE_URL }}
          --dart-define=SUPABASE_ANON_KEY=${{ vars.SUPABASE_ANON_KEY }}
      # Always serve the latest version: remove old offline caches on
      # visitors' devices and version the app file with the commit id.
      - run: |
          for d in build/web build/web_admin; do
            cp tool/sw_cleanup.js $d/flutter_service_worker.js
            sed -i "s/__APP_VERSION__/${GITHUB_SHA::8}/" $d/flutter_bootstrap.js
            grep -q "main.dart.js?v=" $d/flutter_bootstrap.js
          done
          rm -rf build/web/admin
          cp -r build/web_admin build/web/admin
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          # GitHub Pages is sometimes slow to confirm a deployment.
          timeout: 1800000
