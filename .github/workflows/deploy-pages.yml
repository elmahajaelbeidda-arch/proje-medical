name: Deploy web demo to GitHub Pages

on:
  push:
    branches: [claude/project-cy6r4n, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
      - run: flutter pub get
      - run: flutter test
      - run: flutter build web --release --pwa-strategy=none --base-href "/${{ github.event.repository.name }}/"
      # Always serve the latest version: remove old offline caches on
      # visitors' devices and version the app file with the commit id.
      - run: |
          cp tool/sw_cleanup.js build/web/flutter_service_worker.js
          sed -i "s/__APP_VERSION__/${GITHUB_SHA::8}/" build/web/flutter_bootstrap.js
          grep -q "main.dart.js?v=" build/web/flutter_bootstrap.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          # GitHub Pages is sometimes slow to confirm a deployment.
          timeout: 1800000
