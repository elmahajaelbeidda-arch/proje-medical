name: Build mobile apps (Android & iOS)

# Builds the users' app «شفاء للناس» for phones and checks it on an Android
# emulator and an iPhone simulator. Files to download are attached to each
# run (Actions > this workflow > the run > Artifacts).
on:
  workflow_dispatch:
  push:
    branches: [claude/project-cy6r4n, main]
    paths:
      - 'lib/**'
      - 'assets/**'
      - 'android/**'
      - 'ios/**'
      - 'integration_test/**'
      - 'pubspec.*'
      - '.github/workflows/build-mobile.yml'

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.9

jobs:
  android:
    name: Android (APK + AAB)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      # Upload key for Google Play, from the repository secrets
      # (Settings > Secrets and variables > Actions). Without it, the
      # files are signed with a debug key: fine to install directly, not
      # accepted by Google Play.
      - name: Release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "Signing with the upload key."
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: debug signing (direct install only)."
          fi
      - name: Build APK and App Bundle
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # One APK for all phones (recent 64-bit and older 32-bit), without
          # the emulator-only x86 copy.
          flutter build apk --release \
            --target-platform android-arm,android-arm64 \
            --dart-define=SUPABASE_URL=${{ vars.SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ vars.SUPABASE_ANON_KEY }}
          flutter build appbundle --release \
            --dart-define=SUPABASE_URL=${{ vars.SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ vars.SUPABASE_ANON_KEY }}
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/shifa-linnas.apk
          cp build/app/outputs/bundle/release/app-release.aab dist/shifa-linnas.aab
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: shifa-linnas-android
          path: dist/
          retention-days: 30

  # Public download link used by the «تحميل لأندرويد» button of the web app:
  # https://github.com/<owner>/<repo>/releases/download/android-latest/shifa-linnas.apk
  # Updated only when the emulator test passed.
  publish-android:
    name: Publish Android download link
    needs: [android, android-device-test]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: shifa-linnas-android
          path: dist
      - name: Update the «android-latest» release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          NOTES="آخر نسخة من تطبيق «شِفاءٌ لِلنّاس» لأندرويد — $(date -u +%Y-%m-%d) — ${GITHUB_SHA::7}"
          if gh release view android-latest >/dev/null 2>&1; then
            gh release edit android-latest --title "شِفاءٌ لِلنّاس — أندرويد" --notes "$NOTES"
          else
            gh release create android-latest --target "$GITHUB_SHA" \
              --title "شِفاءٌ لِلنّاس — أندرويد" --notes "$NOTES"
          fi
          gh release upload android-latest dist/shifa-linnas.apk --clobber
          # Earlier separate file for older phones: no longer needed.
          gh release delete-asset android-latest shifa-linnas-old-phones.apk -y 2>/dev/null || true

  android-device-test:
    name: Android emulator test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Enable KVM (hardware acceleration for the emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: flutter test integration_test/app_test.dart

  ios:
    name: iOS (build + iPhone simulator test)
    # Intel Macs: the arm64 macOS pool is often saturated (jobs never start).
    runs-on: macos-15-intel
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      # A package download once stalled for an hour on these runners:
      # give it a time limit and try once more if needed.
      - name: flutter pub get
        id: pub
        timeout-minutes: 8
        continue-on-error: true
        run: flutter pub get
      - name: flutter pub get (retry)
        if: steps.pub.outcome != 'success'
        timeout-minutes: 10
        run: flutter pub get
      - name: Test on an iPhone simulator
        run: |
          UDID=$(xcrun simctl list devices available | grep -m1 -E "iPhone 1[5-9]" | grep -oE '[0-9A-F-]{36}')
          echo "Simulator: $UDID"
          xcrun simctl boot "$UDID"
          flutter test integration_test/app_test.dart -d "$UDID"
      # Without Apple certificates the build is not signed: it proves the app
      # compiles for iPhone; signing and App Store upload need the
      # association's Apple Developer account (see README).
      - name: Build for iPhone (release, unsigned)
        run: |
          flutter build ios --release --no-codesign \
            --dart-define=SUPABASE_URL=${{ vars.SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ vars.SUPABASE_ANON_KEY }}
          mkdir -p dist/Payload
          cp -R build/ios/iphoneos/Runner.app dist/Payload/
          (cd dist && zip -qr shifa-linnas-unsigned.ipa Payload && rm -rf Payload)
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: shifa-linnas-ios-unsigned
          path: dist/
          retention-days: 30
