<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="tube" x1="0" y1="0" x2="1" y2="0.35">
      <stop offset="0" stop-color="#258C91"/>
      <stop offset="0.55" stop-color="#25937E"/>
      <stop offset="1" stop-color="#269B72"/>
    </linearGradient>
    <linearGradient id="tubeLow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1F7A7E"/>
      <stop offset="1" stop-color="#258C91"/>
    </linearGradient>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#269B72"/>
      <stop offset="0.5" stop-color="#126B50"/>
      <stop offset="1" stop-color="#269B72"/>
    </linearGradient>
    <radialGradient id="bell" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#4AA3A7"/>
      <stop offset="1" stop-color="#126B50"/>
    </radialGradient>
  </defs>
  <!-- stethoscope tube drawn as a heart -->
  <path d="M232 122 C200 66 112 56 74 112 C34 172 66 246 132 306 C176 346 222 382 256 420
           C290 382 336 346 380 306 C446 246 478 172 438 112 C400 56 312 66 280 122"
        fill="none" stroke="url(#tube)" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- ear tips -->
  <path d="M232 122 C238 130 240 136 238 142" fill="none" stroke="#258C91" stroke-width="30" stroke-linecap="round"/>
  <path d="M280 122 C274 130 272 136 274 142" fill="none" stroke="#269B72" stroke-width="30" stroke-linecap="round"/>
  <circle cx="236" cy="146" r="17" fill="#1F7A7E"/>
  <circle cx="276" cy="146" r="17" fill="#22895F"/>
  <!-- tube to the chest piece -->
  <path d="M256 420 C292 460 352 470 392 446 C420 430 430 410 430 392"
        fill="none" stroke="url(#tubeLow)" stroke-width="22" stroke-linecap="round"/>
  <!-- chest piece -->
  <circle cx="432" cy="366" r="40" fill="url(#bell)"/>
  <circle cx="432" cy="366" r="25" fill="#E4F1EB"/>
  <circle cx="432" cy="366" r="13" fill="#258C91"/>
  <!-- heartbeat -->
  <path d="M112 244 H184 L208 204 L242 306 L270 188 L300 244 H402"
        fill="none" stroke="url(#pulse)" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
